# Static site server. Coolify's proxy handles HTTPS in front of this.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Hashed build files never change.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Images keep their names between releases.
  location /tex/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # index.html and the rest: always check for a new release.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
